# Release workflow.
#
# Triggered by pushing a version tag (vX.Y.Z). Runs the full test suite, then
# builds and publishes signed-by-checksum artifacts for every supported target,
# then updates the Homebrew cask in the tap repository.
#
# Action versions are pinned to commit SHAs rather than tags so a compromised or
# moved tag cannot change what runs here. Each SHA below was resolved from the
# corresponding release tag and verified to be a commit, not a tag object.
name: release

on:
  push:
    tags:
      - 'v*'
  # Re-runs a release for an existing tag. This PUBLISHES, despite being a
  # manual dispatch: it is a recovery path for a failed or incomplete release,
  # not a dry run.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

# Least privilege by default. The release job needs more, and declares it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.9'

jobs:
  verify:
    name: verify
    # ubuntu-22.04 deliberately, not ubuntu-24.04.
    #
    # The sandbox probes build a network namespace and add a loopback address
    # in it. GitHub's ubuntu-24.04 image runs jobs in a container that forbids
    # RTM_NEWADDR, so bubblewrap fails there with
    # "Failed RTM_NEWADDR: Operation not permitted" and the suite fails for a
    # reason that says nothing about this code.
    #
    # ubuntu-22.04 is the runner the existing verify workflow already uses and
    # is known to pass. When that image is retired the probes will need a
    # runner that permits these namespaces, not a different image version.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap curl
      - run: go mod verify
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          CAPTAINCODE_SANDBOX_TEST: '1'
      # Install the exact GoReleaser build the release job will use, then
      # validate with it. Running the check through "go run" would compile
      # GoReleaser from source, which needs Go >= 1.27.1 and fails under the
      # project's pinned 1.26.9 toolchain. install-only keeps the check and the
      # release on one identical binary instead of two versions that could
      # disagree about a config.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Validate the GoReleaser configuration
        run: goreleaser check

  release:
    name: release
    needs: verify
    runs-on: ubuntu-24.04
    # Only the release job may write. contents:write is required to create the
    # GitHub Release and upload artifacts. Nothing else is granted.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          tag: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the release artifacts locally as a sanity check
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ inputs.tag || github.ref_name }}" \
            -o ./dist-check/captaincode ./cmd/captaincode
          ./dist-check/captaincode version
          rm -rf ./dist-check

      # The tap repository is a separate repository. GITHUB_TOKEN cannot write
      # to it, so publishing the cask requires a token with write access to
      # john-nash-rs/homebrew-tap. If the secret is absent the release still
      # publishes; only the cask update is skipped, and it says so.
      - name: Publish the release and update the Homebrew cask
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for the Homebrew tap push. Scoped to that one
          # repository; grant it no other access.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # The token is passed through env and referenced as a shell variable.
      # Interpolating ${{ secrets.* }} directly into a run block embeds the
      # secret value in the rendered script, where a quote or $(...) in the
      # token would break or inject into the shell.
      - name: Report cask publication status
        if: always()
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -f dist/homebrew/Casks/captaincode.rb ]; then
            echo "Cask generated at dist/homebrew/Casks/captaincode.rb"
            if [ -z "$TAP_TOKEN" ]; then
              echo ""
              echo "HOMEBREW_TAP_TOKEN is not configured, so the cask was"
              echo "NOT pushed to john-nash-rs/homebrew-tap. Copy it manually:"
              echo "  cp dist/homebrew/Casks/captaincode.rb \\"
              echo "     <homebrew-tap-repo>/Casks/captaincode.rb"
            else
              echo "Cask pushed to the tap repository."
            fi
          fi