# Release workflow.
#
# Triggered by pushing a version tag (vX.Y.Z). Runs the full test suite, then
# builds and publishes signed-by-checksum artifacts for every supported target,
# then updates the Homebrew cask in the tap repository.
#
# Action versions are pinned to commit SHAs rather than tags so a compromised or
# moved tag cannot change what runs here. Each SHA below was resolved from the
# corresponding release tag and verified to be a commit, not a tag object.
name: release

on:
  push:
    tags:
      - 'v*'
  # Re-runs a release for an existing tag. This PUBLISHES, despite being a
  # manual dispatch: it is a recovery path for a failed or incomplete release,
  # not a dry run.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

# Least privilege by default. The release job needs more, and declares it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.9'

jobs:
  verify:
    name: verify
    # ubuntu-22.04 deliberately, not ubuntu-24.04.
    #
    # The sandbox probes build a network namespace and add a loopback address
    # in it. GitHub's ubuntu-24.04 image runs jobs in a container that forbids
    # RTM_NEWADDR, so bubblewrap fails there with
    # "Failed RTM_NEWADDR: Operation not permitted" and the suite fails for a
    # reason that says nothing about this code.
    #
    # ubuntu-22.04 is the runner the existing verify workflow already uses and
    # is known to pass. When that image is retired the probes will need a
    # runner that permits these namespaces, not a different image version.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap curl
      - run: go mod verify
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          CAPTAINCODE_SANDBOX_TEST: '1'
      # Install the exact GoReleaser build the release job will use, then
      # validate with it. Running the check through "go run" would compile
      # GoReleaser from source, which needs Go >= 1.27.1 and fails under the
      # project's pinned 1.26.9 toolchain. install-only keeps the check and the
      # release on one identical binary instead of two versions that could
      # disagree about a config.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: Validate the GoReleaser configuration
        run: goreleaser check

  verify-windows:
    name: verify Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          tag: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          CAPTAINCODE_SANDBOX_TEST: '1'
      - name: Build and smoke the Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=${{ inputs.tag || github.ref_name }}" -o bin/captaincode.exe ./cmd/captaincode
          .\bin\captaincode.exe version
      - name: Release journey
        env:
          CAPTAINCODE_TEST_BINARY: ${{ github.workspace }}\bin\captaincode.exe
        run: go test -count=1 -v ./evals/ -run 'Journey'

  release:
    name: release
    needs: [verify, verify-windows]
    runs-on: ubuntu-24.04
    # Only the release job may write. contents:write is required to create the
    # GitHub Release and upload artifacts. Nothing else is granted.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          tag: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the release artifacts locally as a sanity check
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ inputs.tag || github.ref_name }}" \
            -o ./dist-check/captaincode ./cmd/captaincode
          ./dist-check/captaincode version
          rm -rf ./dist-check

      # The tap repository is a separate repository. GITHUB_TOKEN cannot write
      # to it, so publishing the cask requires HOMEBREW_TAP_TOKEN.
      #
      # That token is a deployment concern, not a release concern, and
      # conflating the two has cost three failed-looking releases in a row:
      # every artifact published correctly and the run was still marked red
      # because the last step could not reach the tap. The cask is therefore
      # published in its own job, after the release, where a failure is
      # reported as what it is.
      - name: Publish the release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.3
          # homebrew is skipped here and done in the publish-cask job below,
          # where its failure cannot mark a good release as failed.
          #
          # --skip also suppresses generating the cask, not just pushing it,
          # so the cask is built afterwards from the checksums this release
          # just published. Those are the same digests Homebrew verifies
          # against, so the two cannot disagree.
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the cask
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          mkdir -p cask
          curl -fsSL -o checksums.txt \
            "https://github.com/john-nash-rs/captaincode/releases/download/$TAG/checksums.txt"
          go run ./cmd/mkcask -tag "$TAG" -checksums checksums.txt -out cask/captaincode.rb
          echo "generated:"
          head -4 cask/captaincode.rb

      # The generated cask is carried across as an artifact. Without this the
      # only copy lives in the release job's filesystem, which ends with it.
      - name: Save the generated cask
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-cask
          path: cask/captaincode.rb
          if-no-files-found: warn
          retention-days: 7

      # The token is passed through env and referenced as a shell variable.
      # Interpolating ${{ secrets.* }} directly into a run block embeds the
      # secret value in the rendered script, where a quote or $(...) in the
      # token would break or inject into the shell.
      

  # Publishing the cask is separate from publishing the release.
  #
  # The release is the thing that must not fail silently; the cask is a
  # convenience for one installer on one platform. Coupling them meant a token
  # problem made a perfectly good release look broken, which is the opposite
  # of useful: the artifacts were there and the signal was noise.
  #
  # This job never fails the workflow. It reports what happened so the gap is
  # visible, and it names the exact command to run when the token is missing
  # or rejected.
  publish-cask:
    name: publish cask to the tap
    needs: release
    runs-on: ubuntu-24.04
    # Reported, not enforced. A rejected tap token must not make a published
    # release look like a failed one.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: homebrew-cask
          path: cask
      - name: Push the cask
        env:
          # Referenced through the environment and never interpolated into
          # the script, so a quote in the value cannot inject into the shell.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          # The artifact holds the cask, but upload-artifact preserves the
          # path under the least common ancestor, so it may land either at the
          # root of the download directory or under Casks/.
          file=""
          for candidate in cask/Casks/captaincode.rb cask/captaincode.rb; do
            if [ -f "$candidate" ]; then file=$candidate; break; fi
          done
          if [ -z "$file" ]; then
            echo "no cask was generated; nothing to publish"
            exit 0
          fi

          # An empty or whitespace-only token is sent as "Bearer " and comes
          # back 401, which reads exactly like an invalid token. Say so.
          case "$(printf '%s' "$TAP_TOKEN" | tr -d '[:space:]')" in
            "") echo "HOMEBREW_TAP_TOKEN is empty. Set it with:"
               echo "  gh secret set HOMEBREW_TAP_TOKEN --repo john-nash-rs/captaincode"
               exit 0 ;;
          esac

          # Check the credential before using it, so the failure names the
          # token rather than whatever GoReleaser would have said.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TAP_TOKEN" \
            https://api.github.com/repos/john-nash-rs/homebrew-tap)
          if [ "$code" != "200" ]; then
            echo "the token was rejected: HTTP $code"
            echo ""
            echo "It needs, on john-nash-rs/homebrew-tap:"
            echo "  - Contents: Read and write"
            echo "  - that repository selected explicitly, not 'public repositories'"
            echo ""
            echo "Verify with:"
            echo "  curl -s -o /dev/null -w '%{http_code}\\n' \\"
            echo "    -H \"Authorization: Bearer \$TAP_TOKEN\" \\"
            echo "    https://api.github.com/repos/john-nash-rs/homebrew-tap"
            echo ""
            echo "The release itself is published. Push the cask by hand with:"
            echo "  gh api --method PUT repos/john-nash-rs/homebrew-tap/contents/Casks/captaincode.rb \\"
            echo "    -f message='Update cask to $TAG' -f content=\"\$(base64 < $file | tr -d '\n')\" \\"
            echo "    -f sha=\"\$(gh api repos/john-nash-rs/homebrew-tap/contents/Casks/captaincode.rb --jq .sha)\""
            exit 0
          fi
          echo "token accepted"

          sha=$(gh api "repos/john-nash-rs/homebrew-tap/contents/Casks/captaincode.rb" --jq .sha 2>/dev/null || echo "")
          if [ -n "$sha" ]; then
            gh api --method PUT repos/john-nash-rs/homebrew-tap/contents/Casks/captaincode.rb \
              -f message="Update cask to $TAG" \
              -f content="$(base64 < "$file" | tr -d '\n')" \
              -f sha="$sha" > /dev/null
          else
            gh api --method PUT repos/john-nash-rs/homebrew-tap/contents/Casks/captaincode.rb \
              -f message="Add cask" \
              -f content="$(base64 < "$file" | tr -d '\n')" > /dev/null
          fi
          echo "cask pushed to john-nash-rs/homebrew-tap for $TAG"
