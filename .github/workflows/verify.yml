name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap curl
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          CAPTAINCODE_SANDBOX_TEST: '1'
      - run: go build -o bin/captaincode ./cmd/captaincode
      - name: Offline CLI smoke
        # --ide=false because the interface is now the default and needs a
        # terminal, which a runner does not provide.
        run: ./bin/captaincode ./testdata/project --ide=false --db "$RUNNER_TEMP/captaincode-smoke.db"
