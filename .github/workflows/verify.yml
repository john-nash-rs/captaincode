name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      # windows-2022 is here for the platform, not only for the build. Every
      # assumption about paths, environment variables and file permissions
      # that is wrong on Windows passes on the other two and is caught here.
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap curl
      - run: go mod verify
      - run: go vet ./...
      - name: TEMPORARY container diagnosis
        if: runner.os == 'Windows'
        shell: bash
        continue-on-error: true
        run: go test -count=1 -v ./sandbox/ -run 'TestWindows(Container|ACL)Diagnosis'
        env:
          CAPTAINCODE_DIAGNOSE: '1'
      - name: Test
        # The race detector links against a C toolchain that the Windows runner
        # does not reliably provide. The tests still run there, without the
        # detector: three platforms passing is worth more than two passing with
        # the stronger check and one not running at all.
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test -count=1 ./...
          else
            go test -race -count=1 ./...
          fi
        env:
          CAPTAINCODE_SANDBOX_TEST: '1'
      - name: Build
        # go build -o keeps the name it is given, and a Windows executable
        # without a .exe suffix cannot be started, so the suffix is not
        # decoration. $BIN carries the result to the steps below.
        shell: bash
        run: |
          set -eu
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          echo "BIN=bin/captaincode$suffix" >> "$GITHUB_ENV"
          go build -o "bin/captaincode$suffix" ./cmd/captaincode
      - name: Offline CLI smoke
        # --ide=false because the interface is now the default and needs a
        # terminal, which a runner does not provide.
        shell: bash
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          "./$BIN" ./testdata/project --ide=false --db "$RUNNER_TEMP/captaincode-smoke.db"
      - name: Release gate
        # Runs the whole user journey against the binary that was just built,
        # not against the test tree. A release is judged on the artifact, so
        # that is what gets judged here.
        #
        # The journey is offline by design, so this needs no credential and
        # cannot pass by accident on a developer's machine.
        env:
          CAPTAINCODE_TEST_BINARY: ${{ github.workspace }}/${{ env.BIN }}
        run: go test -count=1 -v ./evals/ -run 'Journey'
